<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VincTBest's Website</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon_transparent.ico" type="image/x-icon">
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth.js"></script>
</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <a href="https://github.com/VincTBest" target="_blank">
                <img class="navbar-img" src="favicon_2.png" alt="Illuminati">
            </a>
            <a href="index.html" class="navbar-logo">VincTBest</a>
        </div>
        <ul class="navbar-menu">
            <li><a href="index.html" class="navbar-link">Home</a></li>
            <li><a href="pc.html" class="navbar-link">PC</a></li>
            <li><a href="https://github.com/VincTBest?tab=repositories" target="_blank" class="navbar-link">All Projects</a></li>
        </ul>
        <div class="navbar-right">
            <a href="login.html" id="login-link" class="navbar-link">Login</a>
        </div>
    </div>
</nav>
<div class="main-container">
    <div class="widgets">
        <div class="widget">
            <img src="./icons/pyconsole.png" alt="PyConsole" class="widget-image">
            <h6 class="widget-description">PyConsole</h6>
            <p class="widget-description">PyConsole is a CMD in Python</p>
            <form action="https://www.github.com/VincTBest/PyConsole" target="_blank">
                <input type="submit" value="View" class="widget-view">
            </form>
        </div>
    </div>
</div>
<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCFKGKA71wwQqpCUsF000RZoiXKAExM3pY",
        authDomain: "vinctbest-github-io.firebaseapp.com",
        projectId: "vinctbest-github-io",
        storageBucket: "vinctbest-github-io.appspot.com",
        messagingSenderId: "310367770308",
        appId: "1:310367770308:web:2807727974d29e426a5b91",
        measurementId: "G-YS1Y5NMY07"
    };
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Check if the user is logged in
    firebase.auth().onAuthStateChanged(user => {
        const loginLink = document.getElementById('login-link');
        if (user) {
            loginLink.textContent = 'Profile';
            loginLink.href = 'profile.html';
        }
    });
</script>
</body>
</html>
