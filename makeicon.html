<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>8x8 Canvas Matrix Maker — Export Lua Table</title>
  <style>
    :root{--bg:#f6f8fa;--panel:#fff;--muted:#666}
    html,body{height:100%}
    body{font-family:system-ui,Segoe UI,Roboto,Arial;display:flex;align-items:flex-start;gap:18px;padding:18px;background:var(--bg)}
    .panel{background:var(--panel);padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(15,20,30,0.06);width:480px}
    h1{margin:0;font-size:18px}
    p.hint{margin:6px 0 12px;color:var(--muted);font-size:13px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    button{padding:8px 10px;border-radius:8px;border:1px solid #ddd;background:white;cursor:pointer}
    canvas{background:#fff;border-radius:8px;border:1px solid #e2e6ea;display:block}
    textarea{width:100%;min-height:140px;font-family:monospace;font-size:13px;padding:10px;border-radius:8px;border:1px solid #ddd;resize:vertical}
    .right{width:360px}
    .small{font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="panel">
    <h1>8×8 Canvas Matrix Maker</h1>
    <p class="hint">Click / drag on the canvas to toggle cells. Export produces rows where <code>"█"</code> is ON and <code>" "</code> (space) is OFF — matching your Lua format.</p>

    <canvas id="canvas" width="320" height="320" style="width:320px;height:320px"></canvas>

    <div class="controls" style="margin-top:10px">
      <button id="exportBtn">Export Lua</button>
      <button id="copyBtn">Copy</button>
      <button id="clearBtn">Clear</button>
      <button id="invertBtn">Invert</button>
      <button id="randomBtn">Random</button>
    </div>

    <div class="small">Rows labeled <strong>a</strong>–<strong>h</strong> from top → bottom. Use Shift+Click to set a cell ON, Alt+Click to set it OFF.</div>
  </div>

  <div class="panel right">
    <h1 style="font-size:16px;margin-bottom:6px">Lua Output</h1>
    <textarea id="output" readonly placeholder="Lua table output will appear here..."></textarea>
  </div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const size = 8;
  const cellPx = canvas.width / size; // 40
  const letters = ['a','b','c','d','e','f','g','h'];

  const mat = Array.from({length:size}, ()=> Array.from({length:size}, ()=> false));

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let r=0;r<size;r++){
      for(let c=0;c<size;c++){
        const x = c * cellPx;
        const y = r * cellPx;
        ctx.fillStyle = mat[r][c] ? '#111' : '#fff';
        ctx.fillRect(x+2,y+2,cellPx-4,cellPx-4);
        ctx.strokeStyle = '#e3e6ea';
        ctx.lineWidth = 1;
        ctx.strokeRect(x+0.5,y+0.5,cellPx-1,cellPx-1);
      }
    }
  }

  function getRCFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const c = Math.floor(x / (rect.width / size));
    const r = Math.floor(y / (rect.height / size));
    if(r<0||r>=size||c<0||c>=size) return null;
    return {r,c};
  }

  let mouseDown = false;
  let lastToggled = null;

  function toggleAt(r,c,mode){
    if(r==null) return;
    if(mode==='setOn') mat[r][c]=true;
    else if(mode==='setOff') mat[r][c]=false;
    else mat[r][c]=!mat[r][c];
    draw(); updateExport();
  }

  canvas.addEventListener('mousedown', (e)=>{
    mouseDown=true;
    lastToggled=null;
    const rc=getRCFromEvent(e); if(!rc) return;
    const mode=e.shiftKey?'setOn':(e.altKey?'setOff':'toggle');
    toggleAt(rc.r,rc.c,mode);
    lastToggled=`${rc.r},${rc.c}`;
  });
  window.addEventListener('mouseup', ()=>{mouseDown=false; lastToggled=null});

  canvas.addEventListener('mousemove',(e)=>{
    if(!mouseDown) return;
    const rc=getRCFromEvent(e); if(!rc) return;
    const key=`${rc.r},${rc.c}`;
    if(key===lastToggled) return;
    const mode=e.shiftKey?'setOn':(e.altKey?'setOff':'setOn');
    toggleAt(rc.r,rc.c,mode);
    lastToggled=key;
  });

  canvas.addEventListener('touchstart',(e)=>{e.preventDefault(); mouseDown=true; const rc=getRCFromEvent(e); if(rc) toggleAt(rc.r,rc.c,'setOn');});
  canvas.addEventListener('touchmove',(e)=>{e.preventDefault(); const rc=getRCFromEvent(e); if(rc){const key=`${rc.r},${rc.c}`; if(key!==lastToggled){toggleAt(rc.r,rc.c,'setOn'); lastToggled=key;}}});
  canvas.addEventListener('touchend',(e)=>{mouseDown=false; lastToggled=null});

  const output=document.getElementById('output');
  function getRowString(r){
    return mat[r].map(v=>v?'█':'  ').join('');
  }
  function makeLuaTable(){
    const lines=[];
    lines.push('iconMat = {');
    for(let r=0;r<size;r++){
      lines.push(`\t${letters[r]} = "${getRowString(r)}",`);
    }
    lines.push('}');
    return lines.join('\n');
  }
  function updateExport(){output.value=makeLuaTable();}

  document.getElementById('exportBtn').addEventListener('click',()=>updateExport());
  document.getElementById('copyBtn').addEventListener('click',async()=>{updateExport(); try{await navigator.clipboard.writeText(output.value); const prev=output.value; output.value='-- Copied to clipboard!\n'+prev; setTimeout(()=>output.value=prev,800);}catch(e){alert('Clipboard copy failed — select and copy manually.');}});
  document.getElementById('clearBtn').addEventListener('click',()=>{for(let r=0;r<size;r++) for(let c=0;c<size;c++) mat[r][c]=false; draw(); updateExport();});
  document.getElementById('invertBtn').addEventListener('click',()=>{for(let r=0;r<size;r++) for(let c=0;c<size;c++) mat[r][c]=!mat[r][c]; draw(); updateExport();});
  document.getElementById('randomBtn').addEventListener('click',()=>{for(let r=0;r<size;r++) for(let c=0;c<size;c++) mat[r][c]=Math.random()>0.7; draw(); updateExport();});

  draw(); updateExport();
})();
</script>
</body>
</html>
