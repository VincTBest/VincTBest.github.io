<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth.js"></script>
</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <a href="https://github.com/VincTBest" target="_blank">
                <img class="navbar-img" src="favicon_2.png" alt="Illuminati">
            </a>
            <a href="index.html" class="navbar-logo">VincTBest</a>
        </div>
        <ul class="navbar-menu">
            <li><a href="index.html" class="navbar-link">Home</a></li>
            <li><a href="pc.html" class="navbar-link">PC</a></li>
            <li><a href="https://github.com/VincTBest?tab=repositories" target="_blank" class="navbar-link">All Projects</a></li>
        </ul>
        <div class="navbar-right">
            <a href="login.html" id="login-link" class="navbar-link">Login</a>
        </div>
    </div>
</nav>
<div class="main-container">
    <div class="widgets">
        <div class="widget">
            <h2 id="form-title">Login</h2>
            <form id="auth-form">
                <div id="username-container" style="display: none;">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="submit-button">Login</button>
            </form>
            <p id="toggle-text">Don't have an account? <a href="javascript:void(0);" id="toggle-link">Register here</a></p>
        </div>
    </div>
</div>
<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCFKGKA71wwQqpCUsF000RZoiXKAExM3pY",
        authDomain: "vinctbest-github-io.firebaseapp.com",
        projectId: "vinctbest-github-io",
        storageBucket: "vinctbest-github-io.appspot.com",
        messagingSenderId: "310367770308",
        appId: "1:310367770308:web:2807727974d29e426a5b91",
        measurementId: "G-YS1Y5NMY07"
    };
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    document.addEventListener('DOMContentLoaded', (event) => {
        const authForm = document.getElementById('auth-form');
        const formTitle = document.getElementById('form-title');
        const toggleText = document.getElementById('toggle-text');
        const toggleLink = document.getElementById('toggle-link');
        const submitButton = document.getElementById('submit-button');
        const usernameContainer = document.getElementById('username-container');

        let isRegister = false;

        toggleLink.addEventListener('click', () => {
            isRegister = !isRegister;
            if (isRegister) {
                formTitle.textContent = 'Register';
                submitButton.textContent = 'Register';
                toggleText.innerHTML = 'Already have an account? <a href="javascript:void(0);" id="toggle-link">Login here</a>';
                usernameContainer.style.display = 'block';
            } else {
                formTitle.textContent = 'Login';
                submitButton.textContent = 'Login';
                toggleText.innerHTML = 'Don\'t have an account? <a href="javascript:void(0);" id="toggle-link">Register here</a>';
                usernameContainer.style.display = 'none';
            }
        });

        authForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isRegister) {
                const username = document.getElementById('username').value;
                // Register user
                firebase.auth().createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        return userCredential.user.updateProfile({
                            displayName: username
                        });
                    })
                    .then(() => {
                        alert('Registration successful!');
                        window.location.href = 'index.html';
                    })
                    .catch((error) => {
                        alert(`Error: ${error.message}`);
                    });
            } else {
                // Login user
                firebase.auth().signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        alert('Login successful!');
                        window.location.href = 'index.html';
                    })
                    .catch((error) => {
                        alert(`Error: ${error.message}`);
                    });
            }
        });
    });
</script>
</body>
</html>
